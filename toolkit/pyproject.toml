[project]
name = "ai-toolkit"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = ["anthropic", "python-dotenv"]

[project.optional-dependencies]
   dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolkit"]


